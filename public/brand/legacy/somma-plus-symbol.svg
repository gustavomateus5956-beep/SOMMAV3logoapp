<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="somma-symbol-clip">
      <circle cx="38" cy="40" r="28" />
    </clipPath>
    <linearGradient id="somma-sphere-grad" x1="10" y1="18" x2="66" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1954b8" />
      <stop offset="42%" stop-color="#1e6cd9" />
      <stop offset="100%" stop-color="#2575ea" />
    </linearGradient>
    <linearGradient id="somma-sphere-shadow" x1="10" y1="12" x2="42" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d3f94" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#124ba8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1b63cc" stop-opacity="0" />
    </linearGradient>
    <filter id="plus-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#001844" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left solid sphere with volumetric gradient and shadow arc -->
  <circle cx="38" cy="40" r="28" fill="url(#somma-sphere-grad)" />
  <path d="M 38 12 A 28 28 0 0 0 38 68 L 10 40 Z" fill="url(#somma-sphere-shadow)" clip-path="url(#somma-symbol-clip)" />

  <!-- Right open ring -->
  <circle cx="62" cy="40" r="24" fill="none" stroke="#1e6cd9" stroke-width="7" />

  <!-- Center white plus symbol with rounded caps -->
  <g filter="url(#plus-drop-shadow)">
    <rect x="44.5" y="37.5" width="11" height="5" rx="1.8" fill="#ffffff" />
    <rect x="47.5" y="34.5" width="5" height="11" rx="1.8" fill="#ffffff" />
  </g>
</svg>
